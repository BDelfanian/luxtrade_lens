[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luxtrade"
version = "0.1.0"
description = "Interactive exploration of Luxembourg's external trade in goods (STATEC Hackathon 2026, The Outliers)"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.12"
authors = [{ name = "The Outliers (Behrooz Delfanian, Mina Naseh, Kasra)" }]
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "duckdb>=1.4,<2",
    "duckdb-engine>=0.17,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.2.2,<2",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
    "py7zr>=1.0,<2",
]

[project.optional-dependencies]
dashboard-api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas", "plotly", "sqlglot"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luxtrade = ["semantic/limitations.yaml", "agents/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PD", "D"]
ignore = ["D100", "D104", "D107", "D203", "D213", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PD008"]
"notebooks/**" = ["D", "E501"]
# multilingual label and template tables: long translated strings stay on one line
"src/luxtrade/process/nomenclature.py" = ["E501"]
"src/luxtrade/agents/facts.py" = ["E501"]
"src/luxtrade/agents/findings.py" = ["E501"]
"src/luxtrade/agents/overview.py" = ["E501"]
"src/luxtrade/semantic/catalog.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow and not network'"
markers = [
    "slow: long-running tests (deselected by default)",
    "network: tests that call external services (deselected by default)",
]
